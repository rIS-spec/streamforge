name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build + Unit Tests + Server Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run test suite
        working-directory: build
        run: ctest --output-on-failure

      # Unit tests never start the server binary. This does: real TCP traffic,
      # a hostile client, then a clean shutdown.
      - name: Server smoke test
        run: bash scripts/smoke_test.sh build

  sanitizers:
    name: ASan + UBSan (tests + server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure with sanitizers
        run: >
          cmake -B build-san -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build with sanitizers
        run: cmake --build build-san

      - name: Run test suite under sanitizers
        working-directory: build-san
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --output-on-failure

      - name: Server smoke test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: bash scripts/smoke_test.sh build-san

  tsan:
    name: ThreadSanitizer (concurrency tests + server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      # GCC 13's TSan runtime aborts on kernels with high ASLR entropy
      # ("unexpected memory mapping"). Lowering it is the standard workaround.
      - name: Lower ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure with TSan
        run: >
          cmake -B build-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build with TSan
        run: cmake --build build-tsan

      - name: Concurrency-focused tests under TSan
        working-directory: build-tsan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest -R "Concurrency|ThreadPool|Broker" --output-on-failure --timeout 600

      - name: Server smoke test under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: bash scripts/smoke_test.sh build-tsan

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build clang-tidy

      - name: Configure (generates compile_commands.json)
        run: cmake -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on our own source (excludes googletest)
        run: |
          find include src -name '*.h' -o -name '*.cpp' | \
          xargs clang-tidy -p build --quiet || true
        # `|| true`: findings are reported but do not block merges until a
        # baseline cleanup pass has been done.
      
      - name: Check clang-format compliance
        run: |
          sudo apt-get install -y clang-format
          find include src tests -name '*.h' -o -name '*.cpp' | \
          xargs clang-format --dry-run --Werror